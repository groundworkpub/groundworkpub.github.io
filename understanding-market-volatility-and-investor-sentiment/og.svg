<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="60%" stop-color="#112240" />
      <stop offset="100%" stop-color="#071322" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Accent -->
  <circle cx="1050" cy="150" r="220" fill="#10B981" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="550" r="180" fill="#3B82F6" opacity="0.08" filter="url(#glow)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" fill="none" />

  <!-- Brand Header -->
  <g transform="translate(80, 80)">
    <!-- Groundwork G Logo Mark -->
    <rect width="48" height="48" rx="12" fill="#10B981" />
    <path d="M24 12C17.37 12 12 17.37 12 24C12 30.63 17.37 36 24 36C29.87 36 34.75 31.8 35.84 26.25H24V21.64H40.24C40.35 22.41 40.46 23.18 40.46 24C40.46 33.08 33.08 40.46 24 40.46C14.92 40.46 7.54 33.08 7.54 24C7.54 14.92 14.92 7.54 24 7.54C29.82 7.54 34.85 10.49 37.7 14.98L33.75 17.61C31.67 14.1 28.06 12 24 12Z" fill="#0A192F" />
    
    <text x="64" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">GROUNDWORK</text>
    <text x="270" y="34" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="300">OPEN RESEARCH</text>
  </g>

  <!-- Category & Type Pills -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="100" height="34" rx="17" fill="rgba(16, 185, 129, 0.18)" stroke="rgba(16, 185, 129, 0.4)" />
    <text x="50" y="22" text-anchor="middle" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">MONEY</text>

    <rect x="112" y="0" width="230" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
    <text x="227" y="22" text-anchor="middle" fill="#CCD6F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">PEER-VERIFIED WHITEPAPER</text>
  </g>

  <!-- Article Title Lines -->
    <text x="80" y="260" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Georgia, serif" font-size="44" font-weight="bold" letter-spacing="-0.5">Understanding market volatility and</text>
    <text x="80" y="314" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Georgia, serif" font-size="44" font-weight="bold" letter-spacing="-0.5">investor sentiment</text>


  <!-- Footer Metadata Bar -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    
    <text x="0" y="36" fill="#8892B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">CERN Zenodo Indexed: <tspan fill="#10B981">DOI:10.5281/zenodo.22011567</tspan></text>
    
    <text x="1040" y="36" text-anchor="end" fill="#CCD6F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">https://gworky.com</text>
  </g>
</svg>
